<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Progression de la réécriture</title><style>*{box-sizing:border-box}body{margin:0;padding:6px;font:13px system-ui;color:#fff}a{display:block;padding:12px 16px;border:1px solid #54776c;border-radius:18px;background:#193b32;color:inherit;text-decoration:none;box-shadow:0 3px 12px #0003}a:focus-visible{outline:3px solid #c5e8a5;outline-offset:2px}header{display:flex;justify-content:space-between;gap:12px;font-size:11px;color:#d4e2da}strong{display:block;font-size:16px;margin:5px 0}progress{display:block;width:100%;height:4px;accent-color:#c5e8a5}small{display:block;margin-top:5px;font-size:10px;color:#d4e2da}</style><a href="https://www.libererlaretraite.com/telechargements/" target="_top" title="Couverture rédactionnelle, pas validation juridique"><header><span>RÉÉCRITURE DES 5 CODES</span><span id="percent">…</span></header><strong id="count">Chargement du compteur…</strong><progress id="bar" max="100" value="0" aria-label="Couverture rédactionnelle"></progress><small id="status">Dernière édition publiée ↗</small></a><script>
const fmt=new Intl.NumberFormat('fr-FR');let busy=false;
async function refresh(){if(busy)return;busy=true;try{const r=await fetch('/downloads/manifest.json',{cache:'no-store'});if(!r.ok)throw Error();const m=await r.json(),n=m.drafted_articles,t=m.source_records;if(!Number.isInteger(n)||!Number.isInteger(t)||t<=0||n<0||n>t)throw Error();const p=100*n/t;document.getElementById('count').textContent=fmt.format(n)+' / '+fmt.format(t)+' articles';document.getElementById('percent').textContent=p.toLocaleString('fr-FR',{maximumFractionDigits:1})+' %';document.getElementById('bar').value=p;document.getElementById('status').textContent='Édition publiée · vérifiée à '+new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})+' ↗';}catch(e){document.getElementById('status').textContent='Actualisation indisponible · voir le suivi ↗';}finally{busy=false;}}
refresh();setInterval(()=>{if(!document.hidden)refresh()},60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
</script></html>
