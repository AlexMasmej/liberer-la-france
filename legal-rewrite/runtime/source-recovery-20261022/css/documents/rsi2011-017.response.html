<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <meta name="theme-color" content="#00006d" />
    <title>Site en maintenance</title>
    <style>
      /* Import fonts */
      @import url(https://fonts.googleapis.com/css?family=Montserrat:400,500);
      /* Global styles */
      html {
        height: 100%;
      }
      body {
        margin: 0;
        padding: 0;
        line-height: 1.5;
        font-size: 1rem;
        font-family: montserrat, sans-serif;
        background: rgb(255, 255, 255);
        background: linear-gradient(152.29deg, #E5E7FF 0%, #F5F6FF 107.21%);
        display: flex;
        align-items: center;
        height: 100%;
      }
      .container {
        padding-right: 1.25rem;
        padding-left: 1.25rem;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: calc(100% - (1.125rem * 2));
        height: -webkit-fill-available;
        min-height: 70%;
        padding-top: 5rem;
        padding-bottom: 5rem;
        background: white;
      }
      h1 {
        font-size: 1.5rem;
        text-align: center;
        margin-top: 1.875rem;
        font-weight: 600;
        margin-left: auto;
        margin-right: auto;
        max-width: 40ch;
        color: #00006d;
      }
      p {
        max-width: 60ch;
        text-align: center;
        margin-bottom: 50px;
      }
      .btn {
        outline: 0;
        display: inline-block;
        font-family: "Montserrat", sans-serif;
        font-size: 1rem;
        font-weight: 500;
        text-align: center;
        vertical-align: middle;
        user-select: none;
        background-color: transparent;
        border: 2px solid #00006d;
        padding: 0.875rem 1.25rem;
        line-height: 1.5;
        border-radius: 0.375rem;
        transition: color 0.15s ease-in-out, background-color 0.15s ease-in-out,
          border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
      }
      .btn:hover,
      .btn:active {
        color: #fff;
        background-color: #00006d;
        border-color: #00006d;
      }
      .btn:focus {
        box-shadow: 0 0 0 0.2rem rgba(12, 73, 90, 0.5);
      }

      /* MEDIAQUERIES */
      @media (min-width: 576px) {
        .container {
          max-width: 540px;
        }
      }
      @media (min-width: 768px) {
        .container {
          max-width: 720px;
        }
      }
      @media (min-width: 992px) {
        .container {
          max-width: 960px;
        }
      }
      @media (min-width: 1200px) {
        .container {
          max-width: 1140px;
        }
      }
    </style>
    <script language="javascript">
      function fermer() {
        window.open("about:blank", "_self");
        window.close();
      }
    </script>
  </head>
  <body>
    <main class="container">
      <svg
        width="50"
        height="50"
        viewBox="0 0 50 50"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
      >
        <path
          d="M50 25C50 38.8057 38.8057 50 25 50C11.1943 50 0 38.8057 0 25C0 11.1943 11.1943 0 25 0C38.8057 0 50 11.1943 50 25Z"
          fill="#e8e9fe"
        />
        <path
          d="M34.709 30.3291L26.4612 15.8556C26.1595 15.3266 25.6015 15 24.9982 15C24.395 15 23.837 15.3266 23.5353 15.8556L15.2262 30.4332C14.9246 30.9622 14.9246 31.6154 15.2262 32.1444C15.5279 32.6734 16.0859 33 16.6891 33H33.3062H33.3109C34.244 33 35 32.2342 35 31.2888C34.9991 30.9336 34.8928 30.6031 34.709 30.3291ZM25.0003 20.0343C25.5216 20.0343 25.9439 20.4621 25.9439 20.9902L25.7025 26.6938C25.678 27.2095 25.2831 27.4052 25.0003 27.4052C24.6836 27.4052 24.3254 27.2362 24.2981 26.6938L24.0567 20.9902C24.0567 20.4621 24.479 20.0343 25.0003 20.0343ZM25.8524 30.2975C25.6299 30.5248 25.3189 30.6547 25.0003 30.6547C24.6817 30.6547 24.3706 30.5248 24.1463 30.2975C23.922 30.0693 23.7938 29.7542 23.7938 29.4314C23.7938 29.1087 23.922 28.7955 24.1463 28.5682C24.3706 28.3409 24.6817 28.2092 25.0003 28.2092C25.3189 28.2092 25.63 28.3409 25.8524 28.5682C26.0786 28.7964 26.2068 29.1116 26.2068 29.4314C26.2068 29.7542 26.0786 30.0693 25.8524 30.2975Z"
          fill="#00006d"
        />
      </svg>

      <h1>Site en maintenance</h1>
      <p>
        Pour améliorer le service, des travaux sont en cours. Celui-ci sera de
        nouveau disponible prochainement.
      </p>
      <p>Nous vous prions de nous excuser pour la gêne occasionnée.</p>

      <button value="Fermer" class="btn" onclick="return fermer();">
        Fermer
      </button>
    </main>
  </body>
</html>
